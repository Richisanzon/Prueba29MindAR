
<html> 
  <head> 
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #playPauseButton {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 15px 30px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>

    <button id="playPauseButton">Pause</button>

    <a-scene mindar-image="imageTargetSrc:./sisters.mind; maxTrack: 2" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="kayleModel" src="./kayle.glb"></a-asset-item>
        <a-asset-item id="morganaModel" src="./morgana.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="morgana-target" mindar-image-target="targetIndex: 0">
        <a-gltf-model id="morgana" rotation="0 0 0 " position="0 -0.25 0" scale="0.5 0.5 0.5" src="#morganaModel" animation-mixer>
      </a-entity>

      <a-entity id="kayle-target" mindar-image-target="targetIndex: 1">
        <a-gltf-model id="kayle" rotation="0 0 0 " position="0 -0.25 0" scale="0.5 0.5 0.5" src="#kayleModel" animation-mixer>
      </a-entity>
    </a-scene>

    <script>
      const morganaTarget = document.querySelector('#morgana-target');
      const kayleTarget = document.querySelector('#kayle-target');
      const morgana = document.querySelector('#morgana');
      const kayle = document.querySelector('#kayle');
      const playPauseButton = document.querySelector('#playPauseButton');
      let animationsPlaying = true;
      // detect Morgana target found
      morganaTarget.addEventListener("targetFound", event => {
        console.log("Morgana target found");
      });
      // detect Morgana target lost
      morganaTarget.addEventListener("targetLost", event => {
        console.log("Morgana target lost");
      });
      // detect Kayle target found
      kayleTarget.addEventListener("targetFound", event => {
        console.log("Kayle target found");
      });
      // detect Kayle target lost
      kayleTarget.addEventListener("targetLost", event => {
        console.log("Kayle target lost");
      });
      // Play / Pause animations
      playPauseButton.addEventListener("click", () => {

        if (animationsPlaying) {

          morgana.setAttribute("animation-mixer", "timeScale: 0");
          kayle.setAttribute("animation-mixer", "timeScale: 0");

          playPauseButton.innerText = "Play";

          animationsPlaying = false;

        } else {

          morgana.setAttribute("animation-mixer", "timeScale: 1");
          kayle.setAttribute("animation-mixer", "timeScale: 1");

          playPauseButton.innerText = "Pause";

          animationsPlaying = true;

        }

      });

    </script>

  </body>
</html>
```
